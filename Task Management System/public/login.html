<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login — Workly</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center">

<div class="bg-white p-10 rounded-xl shadow w-[420px]">
  <img src="assets/logo.png" class="w-14 mx-auto mb-4">
  <h1 class="text-center text-xl font-semibold mb-6">Task Management System</h1>

  <form id="loginForm" class="space-y-4">
    <input name="email" type="email" class="w-full p-3 border rounded text-sm" placeholder="Email" required>
    <input name="password" type="password" class="w-full p-3 border rounded text-sm" placeholder="Password" required>

    <button id="loginBtn" class="w-full bg-gray-900 text-white py-3 rounded text-sm font-medium">
      Login
    </button>
  </form>

  <p class="text-center text-sm mt-5">
    No account? <a href="register.html" class="text-blue-600">Register</a>
  </p>
</div>

<div id="toast"
     class="hidden fixed top-5 right-5 text-white px-4 py-2 rounded shadow-lg transition-all duration-300 z-50"
     style="opacity:0;">
</div>

<script src="js/login.js"></script>

</body>
</html>
